# Pull the Homebrew formula that momiji-rs/sasso's release attaches to each
# GitHub Release, and commit it here.
#
# The direction matters. cargo-dist can PUSH the formula into this tap from the
# sasso repo, but that needs a cross-repo write token held as a secret over
# there. Reading a public repo's releases needs no credential at all, so this
# tap pulls instead and commits with its own built-in GITHUB_TOKEN. There is no
# secret anywhere in either repo.
#
# The formula is machine-generated by `dist` (checksums included), so nothing
# here writes Ruby — this job only moves a file and refuses to move a bad one.
#
# ⚠️ GitHub disables `schedule` triggers in a repository with no commits for 60
# days. This tap only commits when sasso releases, so a long quiet period will
# silently stop the cron. `workflow_dispatch` always works; re-running it also
# re-arms the schedule.
name: sync-formula

on:
  schedule:
    # Every 3 hours, the cadence Homebrew's own BrewTestBot autobump runs at.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-formula
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Fetch the formula from sasso's latest release
        id: fetch
        env:
          # The tap's own token. It can read momiji-rs/sasso because that repo
          # is public; it has no write access there and does not need any.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag=$(gh release view --repo momiji-rs/sasso --json tagName --jq .tagName)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sasso's latest release is $tag"

          # Releases cut before the homebrew installer was enabled carry no
          # formula. That is not a failure — there is simply nothing to sync
          # yet — so say so and stop rather than going red eight times a day.
          if ! gh release download "$tag" --repo momiji-rs/sasso \
                 --pattern sasso.rb --output /tmp/sasso.rb --clobber; then
            echo "::notice::$tag has no sasso.rb asset; nothing to sync"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"

      - name: Check the formula before trusting it
        if: steps.fetch.outputs.found == 'true'
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          set -euo pipefail
          # Three ways the artifact can be wrong, all of which have to stop the
          # commit rather than reach a `brew install`:
          #
          # 1. a truncated or unrelated download;
          # 2. a formula whose `version` is not the tag it came from;
          # 3. a formula with no `sha256` lines. `dist` omits them when it
          #    renders without the platform tarballs at hand, which is exactly
          #    what a partial release looks like — and Homebrew would then
          #    install an unverified download.
          head -1 /tmp/sasso.rb | grep -qx 'class Sasso < Formula' \
            || { echo "::error::not a sasso formula"; exit 1; }

          want="${TAG#v}"
          grep -qx "  version \"$want\"" /tmp/sasso.rb \
            || { echo "::error::formula version is not $want"; sed -n 4p /tmp/sasso.rb; exit 1; }

          # One per prebuilt platform the formula covers: macOS and Linux,
          # arm64 and x86_64.
          n=$(grep -c '^      sha256 "' /tmp/sasso.rb || true)
          [ "$n" -eq 4 ] \
            || { echo "::error::expected 4 sha256 lines, found $n"; exit 1; }

      - name: Commit if it changed
        if: steps.fetch.outputs.found == 'true'
        env:
          TAG: ${{ steps.fetch.outputs.tag }}
        run: |
          set -euo pipefail
          if cmp -s /tmp/sasso.rb Formula/sasso.rb; then
            echo "Formula/sasso.rb is already $TAG"
            exit 0
          fi
          cp /tmp/sasso.rb Formula/sasso.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/sasso.rb
          git commit -m "sasso $TAG" \
            -m "Synced from https://github.com/momiji-rs/sasso/releases/tag/$TAG"
          git push
